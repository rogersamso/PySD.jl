name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # lets julia-actions/cache delete old caches
      contents: read
      id-token: write  # uploads coverage to Codecov without a token (OIDC)
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # test/test-models (SDXorg/test-models)
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      # coverage from one Julia version is enough
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1'
        with:
          files: lcov.info
          # pull requests from forks get no OIDC token: Codecov takes theirs without one
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  # The oldest versions the compat bounds in Project.toml allow
  downgrade:
    name: Oldest dependencies (Julia 1.10)
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          mode: deps
          julia_version: '1.10'
          skip: Libdl, LinearAlgebra, Random, Test
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
