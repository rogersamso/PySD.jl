# The explorer behind Caddy: HTTPS, and a password for each user.
# Settings in .env next to this file (see README.md).
services:
  explorer:
    build:
      context: ../..                     # the PySD.jl repository
      dockerfile: explorer/deploy/Dockerfile
    restart: unless-stopped
    environment:
      PYSD_USERS: header
      PYSD_ADMINS: ${ADMINS}
      PYSD_TITLE: ${TITLE:-}
      PYSD_MODEL: ${MODEL:-}
      PYSD_INPUT_DIRS: ${INPUT_DIRS:-}
      PYSD_SENSITIVITY: ${SENSITIVITY:-}
    volumes:
      - ${MODEL_DIR}:/model:ro
      - explorer-data:/data
    # no "ports": only Caddy reaches it, on the compose network
    mem_limit: ${MEMORY:-6g}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./users.caddy:/etc/caddy/users.caddy:ro
      - caddy-data:/data
    depends_on:
      - explorer

volumes:
  explorer-data:
  caddy-data:
